# Kitty config — JetBrains Mono + GitHub Dark theme + Wayland-optimized

# ==== Font ====
font_family JetBrains Mono
font_size 11.0
disable_ligatures never

# ==== Cursor ====
cursor_shape block
cursor_blink_interval 0
cursor_stop_after_key_press 3

# ==== GitHub Dark palette ====
background            #0d1117
foreground            #c9d1d9
selection_background  #264f78
selection_foreground  #ffffff

# black (grays)
color0 #484f58
color8 #6e7681
# red
color1  #f85149
color9  #f85149
# green
color2  #3fb950
color10 #3fb950
# yellow
color3  #d29922
color11 #d29922
# blue
color4  #58a6ff
color12 #58a6ff
# magenta
color5  #bc8cff
color13 #bc8cff
# cyan
color6  #76e3ea
color14 #76e3ea
# white
color7  #b6c2cf
color15 #ffffff

# ==== Layout & bells ====
placement_strategy center
remember_window_size no
initial_window_width  900
initial_window_height 580
window_padding_width  4
window_padding_height 2
confirm_os_window_close 0
bell_on_tab no

# ==== Performance ====
linux_display_server wayland
background_opacity 0.95
background_blur 0
