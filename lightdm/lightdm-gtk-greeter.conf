# lightdm-gtk-greeter config — Arc-Dark theme
[greeter]
# ==== Tema ====
theme-name=Arc-Dark
icon-theme-name=Papirus-Dark
cursor-theme-name=macOS-White

# ==== Font ====
font-name=SF Pro Display 11

# ==== Tampilan & perilaku ====
background=/home/wildan/Pictures/wallpaper/Joey-Jordison.jpg
user-background=false
position=50%,center 50%,center
show-clock=true
clock-format=%A, %d %B %H:%M
indicators=~clock;~language;~session;~power
hide-user-image=true
