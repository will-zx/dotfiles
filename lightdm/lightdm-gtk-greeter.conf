# lightdm-gtk-greeter config — Arc-Dark (tema turunan, lihat gtk.css)
[greeter]
# ==== Tema ====
# ThemeName menunjuk ke /usr/share/themes/Arc-Dark-Greeter, hasil install
# install.sh. CSS greeter harus berada di dalam GTK theme — lightdm-gtk-greeter
# 2.0.9 TIDAK membaca file .css terpisah.
theme-name=Arc-Dark-Greeter
icon-theme-name=Papirus-Dark
cursor-theme-name=macOS-White

# ==== Font ====
font-name=SF Pro Display 11

# ==== Tampilan & perilaku ====
# CATATAN: greeter berjalan sebagai user sistem (bukan user desktop), jadi
# $HOME TIDAK bisa dipakai di sini. Path wallpaper harus absolut & spesifik
# per mesin — sesuaikan username bila dipakai di mesin lain.
background=/home/wildan/dotfiles/wallpapers/wp6.jpg
user-background=false
position=50%,center 50%,center
show-clock=true
clock-format=%A, %d %B %H:%M
indicators=~clock;~language;~session;~power
hide-user-image=true
