# Persisted desktop environment variables
# Applied by systemd-user at login (XDG_CONFIG_HOME/environment.d)

# Qt theming: qt5ct manager (untuk app Qt5).
# CATATAN: hanya satu nilai yang bisa aktif_global, jadi app Qt6 perlu
# QT_QPA_PLATFORMTHEME=qt6ct di wrapper-nya masing-masing.
QT_QPA_PLATFORMTHEME=qt5ct

# GTK theme dark preference
GTK_THEME=Arc-Dark

# Wayland
XDG_SESSION_TYPE=wayland
MOZ_ENABLE_WAYLAND=1

# NVIDIA Wayland hybrid (Intel Iris Xe = iGPU utama, RTX 3050 = dGPU).
#
# Sengaja TIDAK menyetel GBM_BACKEND / __GLX_VENDOR_LIBRARY_NAME secara
# global: pada hybrid GPU itu membuat GL rusak di iGPU dan membumi XWayland.
# Lihat komentar di sway/config: dGPU hanya dipakai per-app lewat
# skrip prime-run (~/.local/bin/prime-run).
#
# LIBVA_DRIVER_NAME juga tidak disetel: driver VA untuk NVIDIA
# (nvidia-vaapi-driver) tidak terpasang di mesin ini, jadi memaksa
# driver "nvidia" justru mematikan VA-API (yang tersedia: iHD).
WLR_NO_HARDWARE_CURSORS=1
