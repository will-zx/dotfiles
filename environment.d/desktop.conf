# Persisted desktop environment variables
# Applied by systemd-user at login (XDG_CONFIG_HOME/environment.d)

# Qt theming: qt5ct/qt6ct manager
QT_QPA_PLATFORMTHEME=qt5ct

# GTK theme dark preference
GTK_THEME=Arc-Dark

# NVIDIA Wayland hybrid (Intel Iris Xe + RTX 3050)
LIBVA_DRIVER_NAME=nvidia
GBM_BACKEND=nvidia-drm
WLR_NO_HARDWARE_CURSORS=1

# Wayland
XDG_SESSION_TYPE=wayland
MOZ_ENABLE_WAYLAND=1

# XWayland OpenGL vendor hint
__GLX_VENDOR_LIBRARY_NAME=nvidia
